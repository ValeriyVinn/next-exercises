<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Two-Digit Numbers</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <h1>Add Two-Digit Numbers</h1>

      <section class="task">
        <p class="question">
          <button id="generate-button" type="button">Generate Numbers</button>
          <span id="number1"></span>
          +
          <span id="number2"></span>
          =
        </p>

        <input id="answer" type="number" placeholder="Your answer" />

        <button id="check-button" type="button">Check</button>

        <p id="result"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
